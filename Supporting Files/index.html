<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore World</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      color: #333;
    }

    header {
      height: 100vh;
      background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
                  url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    nav {
      position: absolute;
      top: 20px;
      width: 90%;
      display: flex;
      justify-content: space-between;
      color: white;
    }

    nav h2 {
      font-weight: 700;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
    }

    nav ul li {
      cursor: pointer;
    }

    .hero {
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .hero p {
      margin-bottom: 20px;
    }

    .hero button {
      padding: 10px 20px;
      border: none;
      background: #ff7a18;
      color: white;
      font-size: 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .section {
      padding: 50px 10%;
      text-align: center;
    }

    .destinations {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card h3 {
      padding: 15px;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <h2>TravelX</h2>
      <ul>
        <li>Home</li>
        <li>Destinations</li>
        <li>Packages</li>
        <li>Contact</li>
      </ul>
    </nav>

    <div class="hero">
      <h1>Explore The World</h1>
      <p>Your journey begins here</p>
      <button>Start Exploring</button>
    </div>
  </header>

  <section class="section">
    <h2>Popular Destinations</h2>

    <div class="destinations">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb">
        <h3>Mountains</h3>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
        <h3>Beaches</h3>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d">
        <h3>Cities</h3>
      </div>
    </div>
  </section>

  <section class="section">
    <h2>Why Choose Us?</h2>
    <p>We provide the best travel experiences with affordable prices and top destinations.</p>
  </section>

  <footer>
    <p>© 2026 TravelX | Designed by Kartik</p>
  </footer>

</body>
</html>
